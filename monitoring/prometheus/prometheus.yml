global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'tw-greenchain-platform'

rule_files:
  - '/etc/prometheus/alerts/*.yml'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'greenchain-api'
    static_configs:
      - targets: ['greenchain-api:8888']
    metrics_path: '/metrics'

  - job_name: 'mysql'
    static_configs:
      - targets: ['mysql-exporter:9104']
