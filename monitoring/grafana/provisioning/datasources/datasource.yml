apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false
    jsonData:
      timeInterval: 15s

  - name: MySQL-GreenChain
    uid: mysql-greenchain
    type: mysql
    access: proxy
    url: mysql:3306
    database: greenchain_market
    user: root
    isDefault: true
    secureJsonData:
      password: ${MYSQL_ROOT_PASSWORD}
    jsonData:
      maxOpenConns: 5
      maxIdleConns: 2
